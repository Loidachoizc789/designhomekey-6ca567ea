name: Build and Deploy to docs/

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lovable-deploy]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eaikzwcazujcddtcwcqk.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaWt6d2NhenVqY2RkdGN3Y3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MDQwMzUsImV4cCI6MjA4NTE4MDAzNX0.--k-fQ-Gh-F9c_Tob1KOTLk0e4r3rpfokaTvfwRLJEw' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'eaikzwcazujcddtcwcqk' }}
        run: bun run build

      - name: Sync dist to docs
        run: |
          # Preserve CNAME
          cp docs/CNAME /tmp/CNAME 2>/dev/null || true
          rm -rf docs
          mv dist docs
          cp /tmp/CNAME docs/CNAME 2>/dev/null || true

      - name: Inject meta images from Supabase (og/twitter/favicon)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eaikzwcazujcddtcwcqk.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaWt6d2NhenVqY2RkdGN3Y3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MDQwMzUsImV4cCI6MjA4NTE4MDAzNX0.--k-fQ-Gh-F9c_Tob1KOTLk0e4r3rpfokaTvfwRLJEw' }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_ANON_KEY;
          (async () => {
            const res = await fetch(`${url}/rest/v1/site_settings?id=in.(og_image,twitter_image,favicon)&select=id,value`, {
              headers: { apikey: key, Authorization: `Bearer ${key}` }
            });
            if (!res.ok) { console.error('Fetch failed', res.status); return; }
            const rows = await res.json();
            const map = {};
            rows.forEach(r => { if (r.value && r.value.url) map[r.id] = r.value.url; });
            console.log('Meta images from DB:', map);

            let html = fs.readFileSync('docs/index.html', 'utf8');
            const replaceMeta = (prop, val) => {
              if (!val) return;
              const re = new RegExp(`(<meta\\s+property="${prop}"\\s+content=")[^"]*(")`, 'g');
              if (re.test(html)) html = html.replace(re, `$1${val}$2`);
              const re2 = new RegExp(`(<meta\\s+name="${prop}"\\s+content=")[^"]*(")`, 'g');
              if (re2.test(html)) html = html.replace(re2, `$1${val}$2`);
            };
            replaceMeta('og:image', map.og_image);
            replaceMeta('twitter:image', map.twitter_image || map.og_image);
            if (map.favicon) {
              html = html.replace(/(<link\s+rel="icon"[^>]*href=")[^"]*(")/g, `$1${map.favicon}$2`);
            }
            fs.writeFileSync('docs/index.html', html);
            console.log('Injected meta images into docs/index.html');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          # SPA fallback for GitHub Pages (after injection)
          cp docs/index.html docs/404.html

      - name: Commit and push
        run: |
          git config user.name "lovable-deploy-bot"
          git config user.email "deploy-bot@lovable.app"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: sync site from Lovable [skip ci]"
            git push
          fi
